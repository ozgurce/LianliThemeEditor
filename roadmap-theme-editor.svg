<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="appBg" cx="24%" cy="4%" r="115%">
      <stop offset="0%" stop-color="#243D7B"/>
      <stop offset="36%" stop-color="#102956"/>
      <stop offset="100%" stop-color="#07152F"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182B55" stop-opacity="0.74"/>
      <stop offset="52%" stop-color="#0A1A35" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#172E59" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#060E20"/>
      <stop offset="50%" stop-color="#040C1A"/>
      <stop offset="100%" stop-color="#060E20"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#001A4A8C"/>
      <stop offset="35%" stop-color="#602478F3"/>
      <stop offset="65%" stop-color="#8045A0FF"/>
      <stop offset="100%" stop-color="#001A4A8C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122D58" stop-opacity="0.88"/>
      <stop offset="58%" stop-color="#0B2348" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#143563" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="phaseNow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2478F3"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="phaseNext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2478F3"/>
    </linearGradient>
    <linearGradient id="phaseVision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20BFA8"/>
      <stop offset="100%" stop-color="#45A0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000820" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 54px Arial, Helvetica, sans-serif; fill: #F5F7FA; letter-spacing: 0; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #C9D1D9; letter-spacing: 0; }
      .brand { font: 700 15px Arial, Helvetica, sans-serif; fill: #8FCAFF; letter-spacing: 0; }
      .focus { font: 700 14px Arial, Helvetica, sans-serif; fill: #8FCAFF; letter-spacing: 0; }
      .phase { font: 800 28px Arial, Helvetica, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .phase-note { font: 500 16px Arial, Helvetica, sans-serif; fill: #C9D1D9; letter-spacing: 0; }
      .label { font: 800 12px Arial, Helvetica, sans-serif; fill: #8FCAFF; letter-spacing: 0; }
      .card-title { font: 800 20px Arial, Helvetica, sans-serif; fill: #F5F7FA; letter-spacing: 0; }
      .item { font: 400 15.5px Arial, Helvetica, sans-serif; fill: #D7DEE8; letter-spacing: 0; }
      .muted { font: 400 14px Arial, Helvetica, sans-serif; fill: #8F9AA8; letter-spacing: 0; }
      .timeline { font: 700 15px Arial, Helvetica, sans-serif; fill: #C9D1D9; letter-spacing: 0; }
      .shell { fill: url(#shell); stroke: #604977B7; stroke-width: 1.4; filter: url(#shadow); }
      .column { fill: #0B1B38; fill-opacity: 0.58; stroke: #45294A7A; stroke-width: 1.2; }
      .mini-card { fill: url(#card); stroke: #604977B7; stroke-width: 1; }
      .chip { fill: #1645A0FF; stroke: #6045A0FF; stroke-width: 1; }
      .topbar { fill: url(#header); opacity: 0.94; }
      .divider { fill: url(#accentLine); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#appBg)"/>
  <circle cx="260" cy="130" r="160" fill="#253E91FF" opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="1300" cy="820" r="210" fill="#1826C6A5" opacity="0.14" filter="url(#softGlow)"/>

  <rect x="58" y="46" width="1484" height="908" rx="26" class="shell"/>
  <rect x="58" y="46" width="1484" height="82" rx="26" class="topbar"/>
  <rect x="58" y="126" width="1484" height="2" class="divider"/>

  <g transform="translate(96 72)">
    <circle cx="0" cy="15" r="7" fill="#2478F3"/>
    <circle cx="24" cy="15" r="7" fill="#7C3AED"/>
    <circle cx="48" cy="15" r="7" fill="#20BFA8"/>
    <text class="brand" x="76" y="20">LIANLI THEME EDITOR</text>
  </g>

  <g transform="translate(96 158)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Theme Editor Roadmap</text>
    <text class="subtitle" x="0" y="70" dominant-baseline="hanging">A product path from device-accurate editing to extensible theme creation.</text>
  </g>

  <g transform="translate(1042 168)">
    <rect x="0" y="0" width="410" height="94" rx="14" fill="#30091626" stroke="#604977B7"/>
    <text class="muted" x="22" y="30">Current product focus</text>
    <text class="focus" x="22" y="58">Compatibility -> Preview parity -> Workflow</text>
    <text class="focus" x="22" y="78">-> Ecosystem</text>
  </g>

  <g transform="translate(140 292)">
    <line x1="0" y1="26" x2="1320" y2="26" stroke="#604977B7" stroke-width="2"/>
    <circle cx="0" cy="26" r="15" fill="#2478F3" stroke="#9AC8FF" stroke-width="3"/>
    <circle cx="660" cy="26" r="15" fill="#7C3AED" stroke="#BFA7FF" stroke-width="3"/>
    <circle cx="1320" cy="26" r="15" fill="#20BFA8" stroke="#8DF4E5" stroke-width="3"/>
    <text class="timeline" x="-14" y="62">Now</text>
    <text class="timeline" x="640" y="62">Next</text>
    <text class="timeline" x="1296" y="62">Vision</text>
  </g>

  <g transform="translate(96 380)">
    <rect class="column" x="0" y="0" width="444" height="506" rx="18"/>
    <rect x="18" y="18" width="408" height="72" rx="14" fill="url(#phaseNow)"/>
    <text class="phase" x="42" y="46">Near Term</text>
    <text class="phase-note" x="42" y="74">Stability and exact device parity</text>

    <g transform="translate(24 120)">
      <rect class="mini-card" x="0" y="0" width="396" height="176" rx="14"/>
      <rect class="chip" x="18" y="18" width="126" height="28" rx="8"/>
      <text class="label" x="34" y="37">COMPATIBILITY</text>
      <text class="card-title" x="18" y="78">Display and variant support</text>
      <text class="item" x="18" y="112">- Support as many display types as possible</text>
      <text class="item" x="18" y="140">- Resolve 8.8 and 9.2 display issues</text>
    </g>

    <g transform="translate(24 298)">
      <rect class="mini-card" x="0" y="0" width="396" height="176" rx="14"/>
      <rect class="chip" x="18" y="18" width="138" height="28" rx="8"/>
      <text class="label" x="34" y="37">DEVICE PARITY</text>
      <text class="card-title" x="18" y="78">Reliable preview rendering</text>
      <text class="item" x="18" y="112">- Support hydroshift variants (oled etc)</text>
      <text class="item" x="18" y="140">- Exact Match preview with device output</text>
      <text class="item" x="18" y="162">- Fix font rendering issues permanently</text>
    </g>
  </g>

  <g transform="translate(578 380)">
    <rect class="column" x="0" y="0" width="444" height="506" rx="18"/>
    <rect x="18" y="18" width="408" height="72" rx="14" fill="url(#phaseNext)"/>
    <text class="phase" x="42" y="46">Later</text>
    <text class="phase-note" x="42" y="74">Tools that complete the theme flow</text>

    <g transform="translate(24 120)">
      <rect class="mini-card" x="0" y="0" width="396" height="176" rx="14"/>
      <rect class="chip" x="18" y="18" width="138" height="28" rx="8"/>
      <text class="label" x="34" y="37">THEME FLOW</text>
      <text class="card-title" x="18" y="78">Import, edit, and deploy</text>
      <text class="item" x="18" y="112">- Import downloaded themes</text>
      <text class="item" x="18" y="140">- Edit existing theme packages</text>
      <text class="item" x="18" y="162">- Send edited themes back to the device</text>
    </g>

    <g transform="translate(24 308)">
      <rect class="mini-card" x="0" y="0" width="396" height="176" rx="14"/>
      <rect class="chip" x="18" y="18" width="118" height="28" rx="8"/>
      <text class="label" x="34" y="37">AUTOMATION</text>
      <text class="card-title" x="18" y="78">Turzx theme fixer</text>
      <text class="item" x="18" y="112">- One-click repair for Turzx themes</text>
      <text class="item" x="18" y="140">- Fast fixes for common old theme</text>
      <text class="item" x="30" y="162">package issues</text>
    </g>
  </g>

  <g transform="translate(1060 380)">
    <rect class="column" x="0" y="0" width="444" height="506" rx="18"/>
    <rect x="18" y="18" width="408" height="72" rx="14" fill="url(#phaseVision)"/>
    <text class="phase" x="42" y="46">Long Term</text>
    <text class="phase-note" x="42" y="74">Ecosystem, gallery, and extensibility</text>

    <g transform="translate(24 120)">
      <rect class="mini-card" x="0" y="0" width="396" height="176" rx="14"/>
      <rect class="chip" x="18" y="18" width="112" height="28" rx="8"/>
      <text class="label" x="34" y="37">SENSORS</text>
      <text class="card-title" x="18" y="78">Sensors beyond L Connect</text>
      <text class="item" x="18" y="112">- Add unsupported sensor data</text>
      <text class="item" x="18" y="140">- Enable richer theme components</text>
      <text class="item" x="18" y="162">- Expand live data bindings</text>
    </g>

    <g transform="translate(24 308)">
      <rect class="mini-card" x="0" y="0" width="396" height="158" rx="14"/>
      <rect class="chip" x="18" y="18" width="112" height="28" rx="8"/>
      <text class="label" x="34" y="37">ECOSYSTEM</text>
      <text class="card-title" x="18" y="78">Plugins and theme gallery</text>
      <text class="item" x="18" y="112">- Plugin support</text>
      <text class="item" x="18" y="140">- Shareable community theme gallery</text>
    </g>
  </g>

  <g transform="translate(96 914)">
    <rect x="0" y="-18" width="1408" height="1.5" class="divider"/>
    <text class="muted" x="0" y="18">Build the reliable editor foundation first, complete the production workflow next, then open the product to plugins and community themes.</text>
  </g>
</svg>
